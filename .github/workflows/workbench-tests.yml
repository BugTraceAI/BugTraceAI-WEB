name: workbench-tests

on:
  push:
    branches: [feature/swarm-ai-workbench]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Workbench unit and component tests
        run: npx vitest run components/workbench

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
